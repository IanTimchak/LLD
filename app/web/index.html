<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Eel App</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<body>
    <div class="container">
        <h1 class="mt-5">Welcome to Python Eel App</h1>
        <p class="lead">This is a simple app using Python Eel and Bootstrap.</p>
        <button class="btn btn-primary" id="myButton">
            Click Me!
        </button>
    </div>

    <!-- Bootstrap JS and dependencies -->

    <script type="text/javascript">
        //Use JQUERY to add a on click event to the button
        $(document).ready(function(){
            $("#myButton").click(function(){
                eel.say_hello_py("World");
            });
        });
        
    </script>
